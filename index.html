<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>ロト予想、置いてみた。</title>
<link rel="icon" href="icon.PNG" type="image/png">
<link rel="apple-touch-icon" href="icon.PNG">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- タイトル行：正式名称を控えめに表示 -->
  <div id="app-title"><span>ロト予想、置いてみた。</span></div>
  <!-- ゲーム切替タブ(ロト7・ロト6・ミニロト。ボタンは app.js が設定から作る)。縦向き:タイトルの下 / 横向き:タイトル行の右側 -->
  <nav id="game-tabs" role="tablist" aria-label="ゲームの切り替え"></nav>
  <!-- A. 操作バー(上部固定):縮小・拡大 / (右寄せ)メモを開く / 設定(歯車) -->
  <div id="status-bar">
    <button id="zoom-out" class="icon-btn" type="button" aria-label="縮小">−</button>
    <button id="zoom-in" class="icon-btn" type="button" aria-label="拡大">＋</button>
    <span class="bar-spacer"></span>
    <button id="memo-open" class="memo-btn" type="button" aria-expanded="false" aria-controls="memo-screen">メモを開く</button>
    <button id="settings-btn" class="icon-btn icon-bare" type="button" aria-label="設定" aria-expanded="false" aria-controls="settings-panel">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </button>
    <input id="csv-input" class="file-hidden" type="file" accept=".csv,text/csv,text/comma-separated-values,.txt" aria-label="CSVファイルを選択">
  </div>
  <!-- 設定パネル(操作バーの下に重ねて表示。レイアウトには影響しない) -->
  <div id="settings-backdrop" hidden></div>
  <div id="settings-panel" role="dialog" aria-label="設定" hidden>
    <div class="cp-head">
      <span class="cp-title">設定</span>
      <button id="sp-close" type="button">閉じる</button>
    </div>
    <div class="sp-group" role="group" aria-labelledby="sp-rounds-label">
      <span id="sp-rounds-label" class="sp-label">表示回数</span>
      <div id="rounds-options" class="seg">
        <button type="button" data-n="5" aria-pressed="false">5回</button>
        <button type="button" data-n="10" aria-pressed="false">10回</button>
        <button type="button" data-n="20" aria-pressed="false">20回</button>
        <button type="button" data-n="30" aria-pressed="false">30回</button>
        <button type="button" data-n="50" aria-pressed="false">50回</button>
      </div>
    </div>
    <!-- 出目表の区切り方(太い区切り線の位置)。選択は localStorage に保存 -->
    <div class="sp-group" role="group" aria-labelledby="sp-zone-label">
      <span id="sp-zone-label" class="sp-label">出目表の区切り方</span>
      <div id="zone-options" class="seg">
        <button type="button" data-z="5" aria-pressed="false">5個</button>
        <button type="button" data-z="6" aria-pressed="false">6個</button>
        <button type="button" data-z="7" aria-pressed="false">7個</button>
        <button type="button" data-z="band" aria-pressed="false">数字帯</button>
        <button type="button" data-z="none" aria-pressed="false">なし</button>
      </div>
    </div>
    <button id="color-btn" class="sp-item" type="button" aria-expanded="false" aria-controls="color-panel">色設定</button>
    <!-- 抽選データ:①現在使用中の抽選データ(読み込み情報欄は従来どおり app.js が表示) -->
    <section class="sp-block sp-block-current" aria-labelledby="sp-current-title">
      <h2 id="sp-current-title" class="sp-block-title">現在使用中の抽選データ</h2>
      <div id="data-info" class="sp-info" aria-label="現在の抽選データ"><div class="sp-info-row"><span class="sp-info-k">抽選データ</span><span class="sp-info-v">確認中…</span></div></div>
    </section>
    <hr class="sp-sep">
    <!-- ②抽選データの選択(ボタンの処理は既存のまま)/ ③内蔵データについて(最新回は default-data.json から取得) -->
    <div class="sp-group" role="group" aria-labelledby="sp-source-label">
      <span id="sp-source-label" class="sp-label">抽選データの選択</span>
      <div class="sp-choice">
        <button id="csv-btn" class="sp-item" type="button">CSV読み込み</button>
        <button id="builtin-btn" class="sp-item" type="button">内蔵データ読み込み</button>
      </div>
      <div class="sp-builtin-note" aria-label="内蔵データについて">
        <p id="builtin-latest" class="sp-builtin-latest" aria-live="polite">内蔵データの最新回を確認中…</p>
        <p class="sp-builtin-text"><span>内蔵データは随時更新しています。</span><span>最新回の反映まで時間がかかる場合があります。</span><span>更新を希望する場合は、ツール作成者にお知らせください。</span></p>
      </div>
    </div>
    <!-- 管理用リンク(テスト環境だけに表示)。environment.json が "test" のときだけ起動処理が表示する。初期状態は非表示 -->
    <div id="admin-links" style="display:none; flex-direction:column; gap:8px;">
      <a id="captain-tool-link" class="sp-item" href="captain-data-tool.html" style="display:flex; align-items:center; flex-shrink:0; box-sizing:border-box; text-decoration:none;">内蔵データ作成ツール</a>
      <!-- 一時的な診断用リンク。読み取り専用の storage-check.html を同じウィンドウで開く。診断が終わったらこの1行を削除する -->
      <a id="storage-check-link" class="sp-item" href="storage-check.html" style="display:flex; align-items:center; flex-shrink:0; box-sizing:border-box; text-decoration:none;">保存領域チェック（一時）</a>
    </div>
  </div>
  <!-- 色設定パネル(操作バーの下に重ねて表示。レイアウトには影響しない) -->
  <div id="color-panel" role="dialog" aria-label="色設定" hidden>
    <div class="cp-head">
      <span class="cp-title">色設定</span>
      <button id="cp-close" type="button">閉じる</button>
    </div>
    <div class="cp-row" data-kind="main">
      <span class="cp-sample" aria-hidden="true">12</span>
      <span class="cp-name">本数字</span>
      <span class="cp-swatches"></span>
      <label class="cp-free">自由<input type="color" aria-label="本数字の色を自由に選ぶ"></label>
    </div>
    <div class="cp-row" data-kind="bonus">
      <span class="cp-sample" aria-hidden="true">12</span>
      <span class="cp-name">ボーナス</span>
      <span class="cp-swatches"></span>
      <label class="cp-free">自由<input type="color" aria-label="ボーナス数字の色を自由に選ぶ"></label>
    </div>
    <div class="cp-foot">
      <span id="cp-warn" hidden>※本数字とボーナスが同じ色です</span>
      <button id="cp-reset" type="button">初期設定に戻す</button>
    </div>
  </div>
  <!-- CSV読み込みの結果・エラー表示(重ねて表示。レイアウトには影響しない) -->
  <div id="game-loading" role="status" aria-live="polite" hidden><span>読み込み中…</span></div>
  <div id="csv-msg" role="status" hidden>
    <div class="cp-head">
      <span class="cp-title" id="csv-msg-title"></span>
      <button id="csv-msg-close" type="button">閉じる</button>
    </div>
    <div id="csv-msg-body"></div>
  </div>
  <!-- B. 選択数字エリア(操作バーの直下・固定):選択中の数字(枠はゲームの本数字の数。app.js が7枠から余分を外す)/ メモに追加 / クリア -->
  <div id="selection-bar">
    <div id="picked" aria-label="選択した数字">
      <span class="chip-slot" data-slot="0"></span>
      <span class="chip-slot" data-slot="1"></span>
      <span class="chip-slot" data-slot="2"></span>
      <span class="chip-slot" data-slot="3"></span>
      <span class="chip-slot" data-slot="4"></span>
      <span class="chip-slot" data-slot="5"></span>
      <span class="chip-slot" data-slot="6"></span>
    </div>
    <span id="selection-msg" role="status" aria-live="polite"></span>
    <button id="memo-add" type="button" aria-label="選択中の7数字を予想メモに追加">メモに追加</button>
    <button id="clear-btn" type="button" aria-label="選択をすべて解除" disabled>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"></path><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg>
    </button>
  </div>
  <!-- C. 出目表・数字タップ欄(1つのスクロール領域。縦横とも #work がスクロールし、全行が同じ横位置を共有する) -->
  <main id="work" aria-label="出目表と数字選択">
    <div id="work-inner">
      <div id="head-row" class="row head"></div>
      <div id="table-rows"></div>
      <div id="pred-wrap"><div id="pred-row" class="row pred"></div></div>
    </div>
  </main>
  <!-- 予想メモ(下からせり上がるボトムシート。出目表のスクロール位置・縮尺・選択は保たれる) -->
  <section id="memo-screen" aria-label="予想メモ" hidden>
    <div id="memo-top">
      <span id="memo-grip" aria-hidden="true"></span>
      <div id="memo-top-row">
        <span class="cp-title">予想メモ</span>
        <button id="memo-close" type="button" aria-label="予想メモを閉じる">×</button>
      </div>
    </div>
    <div id="memo-head">
      <label id="memo-round-label">対象回<select id="memo-round" aria-label="表示する抽選回"></select></label>
      <span id="memo-target"></span>
      <button id="memo-del-all" type="button" disabled>この回を全部削除</button>
      <div id="memo-filter" role="group" aria-label="絞り込み">
        <button type="button" data-filter="all" aria-pressed="true">すべて<span class="mf-n"></span></button>
        <button type="button" data-filter="buy" aria-pressed="false">★ 買う<span class="mf-n"></span></button>
        <button type="button" data-filter="maybe" aria-pressed="false">？ 迷い中<span class="mf-n"></span></button>
      </div>
    </div>
    <div id="memo-warn" hidden>この端末では予想メモを保存できません。画面を閉じると消えます(プライベートブラウズ中の場合は解除してください)。</div>
    <div id="memo-list" role="list"></div>
  </section>
  <!-- 確認ダイアログ・短いお知らせ -->
  <div id="confirm" role="alertdialog" aria-modal="true" aria-labelledby="cf-title" hidden>
    <div class="cf-box">
      <div class="cf-title" id="cf-title"></div>
      <div class="cf-text" id="cf-text"></div>
      <div class="cf-btns">
        <button id="cf-cancel" type="button">キャンセル</button>
        <button id="cf-ok" type="button"></button>
      </div>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
</div>
<!-- 起動処理:environment.json で環境(test / production)を判定してから app.js を読み込む。
     判定できないときはエラーを表示し、app.js を読み込まない(=アプリの初期化を始めない)。
     環境情報はメモリ上(window.LOTO7_ENV)だけに持ち、localStorage・IndexedDB には保存しない。 -->
<script>
(function () {
  'use strict';
  var ENV_FILE = 'environment.json';
  var ENV_TIMEOUT_MS = 10000;
  var VALID_ENVS = ['test', 'production'];

  function showError(message) {
    var box = document.createElement('div');
    box.id = 'env-error';
    box.setAttribute('role', 'alert');
    box.style.cssText = 'position:fixed; inset:0; z-index:10000; display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box; background:var(--paper, #f6f5f0); color:var(--ink, #23262b);';
    var card = document.createElement('div');
    card.style.cssText = 'max-width:420px; width:100%; padding:16px 18px; border:1px solid var(--ink, #23262b); border-radius:10px; background:var(--paper-alt, #ecebe4); line-height:1.6;';
    var title = document.createElement('div');
    title.style.cssText = 'margin-bottom:6px; font-size:16px; font-weight:800;';
    title.textContent = 'ツールを起動できませんでした';
    var text = document.createElement('div');
    text.style.cssText = 'font-size:14px; overflow-wrap:anywhere;';
    text.textContent = message;   // textContent なので値に記号が含まれていても安全に表示される
    card.appendChild(title); card.appendChild(text); box.appendChild(card);
    document.body.appendChild(box);
  }
  function Fail(message) { this.message = message; }

  var ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctl) ctl.abort(); }, ENV_TIMEOUT_MS);
  var req;
  try { req = fetch(ENV_FILE, { cache: 'no-store', signal: ctl ? ctl.signal : undefined }); }
  catch (e0) { clearTimeout(timer); showError('環境設定ファイル(environment.json)を読み込めませんでした。'); return; }

  req.then(function (res) {
    if (res.status === 404) throw new Fail('環境設定ファイル(environment.json)が見つかりません。');
    if (!res.ok) throw new Fail('環境設定ファイル(environment.json)を読み込めませんでした。(HTTP ' + res.status + ')');
    return res.text();
  }, function () {
    throw new Fail('環境設定ファイル(environment.json)を読み込めませんでした。');
  }).then(function (text) {
    clearTimeout(timer);
    var data;
    try { data = JSON.parse(text); } catch (e1) { throw new Fail('環境設定ファイル(environment.json)の形式が正しくありません。JSONとして読み取れませんでした。'); }
    if (!data || typeof data !== 'object' || Array.isArray(data)) throw new Fail('環境設定ファイル(environment.json)の形式が正しくありません。');
    if (!Object.prototype.hasOwnProperty.call(data, 'environment')) throw new Fail('環境設定ファイル(environment.json)に "environment" の設定がありません。');
    var env = data.environment;
    if (typeof env !== 'string' || VALID_ENVS.indexOf(env) < 0) {
      var shown = JSON.stringify(env); if (shown === undefined) shown = String(env);
      if (shown.length > 40) shown = shown.slice(0, 40) + '…';
      throw new Fail('"environment" の値 ' + shown + ' は使用できません。"test" または "production" を指定してください。');
    }
    // 4. 環境情報をメモリ上に保持(書き換え不可)
    Object.defineProperty(window, 'LOTO7_ENV', { value: Object.freeze({ environment: env }), writable: false, configurable: false });
    // 5. 管理用リンクはテスト環境だけに表示(本番は初期状態の非表示のまま)
    if (env === 'test') document.getElementById('admin-links').style.display = 'flex';
    // 6. 既存の app.js を読み込み、通常の初期化を開始する
    var s = document.createElement('script');
    s.src = 'app.js';
    s.onerror = function () { showError('アプリ本体(app.js)を読み込めませんでした。'); };
    document.body.appendChild(s);
  }).catch(function (e) {
    clearTimeout(timer);
    showError(e instanceof Fail ? e.message : '環境設定ファイル(environment.json)を読み込めませんでした。');
  });
})();
</script>
</body>
</html>
