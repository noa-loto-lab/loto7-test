<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>ロト7予想ツール</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- A. 操作バー(上部固定):ロト7表示 / 縮小・拡大 / (右寄せ)メモを開く / 設定(歯車) -->
  <div id="status-bar">
    <span id="game-label" data-game="loto7" role="img" aria-label="ロト7">7</span>
    <button id="zoom-out" class="icon-btn" type="button" aria-label="縮小">−</button>
    <button id="zoom-in" class="icon-btn" type="button" aria-label="拡大">＋</button>
    <span class="bar-spacer"></span>
    <button id="memo-open" class="memo-btn" type="button" aria-expanded="false" aria-controls="memo-screen">メモを開く</button>
    <button id="settings-btn" class="icon-btn icon-bare" type="button" aria-label="設定" aria-expanded="false" aria-controls="settings-panel">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </button>
    <input id="csv-input" class="file-hidden" type="file" accept=".csv,text/csv,text/comma-separated-values,.txt" aria-label="CSVファイルを選択">
  </div>
  <!-- 設定パネル(操作バーの下に重ねて表示。レイアウトには影響しない) -->
  <div id="settings-backdrop" hidden></div>
  <div id="settings-panel" role="dialog" aria-label="設定" hidden>
    <div class="cp-head">
      <span class="cp-title">設定</span>
      <button id="sp-close" type="button">閉じる</button>
    </div>
    <div class="sp-group" role="group" aria-labelledby="sp-rounds-label">
      <span id="sp-rounds-label" class="sp-label">表示回数</span>
      <div id="rounds-options" class="seg">
        <button type="button" data-n="5" aria-pressed="false">5回</button>
        <button type="button" data-n="10" aria-pressed="false">10回</button>
        <button type="button" data-n="20" aria-pressed="false">20回</button>
        <button type="button" data-n="30" aria-pressed="false">30回</button>
        <button type="button" data-n="50" aria-pressed="false">50回</button>
      </div>
    </div>
    <button id="csv-btn" class="sp-item" type="button">ロト7 CSV読み込み・更新</button>
    <button id="color-btn" class="sp-item" type="button" aria-expanded="false" aria-controls="color-panel">色設定</button>
  </div>
  <!-- 色設定パネル(操作バーの下に重ねて表示。レイアウトには影響しない) -->
  <div id="color-panel" role="dialog" aria-label="色設定" hidden>
    <div class="cp-head">
      <span class="cp-title">色設定</span>
      <button id="cp-close" type="button">閉じる</button>
    </div>
    <div class="cp-row" data-kind="main">
      <span class="cp-sample" aria-hidden="true">12</span>
      <span class="cp-name">本数字</span>
      <span class="cp-swatches"></span>
      <label class="cp-free">自由<input type="color" aria-label="本数字の色を自由に選ぶ"></label>
    </div>
    <div class="cp-row" data-kind="bonus">
      <span class="cp-sample" aria-hidden="true">12</span>
      <span class="cp-name">ボーナス</span>
      <span class="cp-swatches"></span>
      <label class="cp-free">自由<input type="color" aria-label="ボーナス数字の色を自由に選ぶ"></label>
    </div>
    <div class="cp-foot">
      <span id="cp-warn" hidden>※本数字とボーナスが同じ色です</span>
      <button id="cp-reset" type="button">初期設定に戻す</button>
    </div>
  </div>
  <!-- CSV読み込みの結果・エラー表示(重ねて表示。レイアウトには影響しない) -->
  <div id="csv-msg" role="status" hidden>
    <div class="cp-head">
      <span class="cp-title" id="csv-msg-title"></span>
      <button id="csv-msg-close" type="button">閉じる</button>
    </div>
    <div id="csv-msg-body"></div>
  </div>
  <!-- B. 選択数字エリア(操作バーの直下・固定):選択中の数字(固定7枠。左に1枠分の余白)/ メモに追加 / クリア -->
  <div id="selection-bar">
    <div id="picked" aria-label="選択した数字">
      <span class="chip-slot" data-slot="0"></span>
      <span class="chip-slot" data-slot="1"></span>
      <span class="chip-slot" data-slot="2"></span>
      <span class="chip-slot" data-slot="3"></span>
      <span class="chip-slot" data-slot="4"></span>
      <span class="chip-slot" data-slot="5"></span>
      <span class="chip-slot" data-slot="6"></span>
    </div>
    <span id="selection-msg" role="status" aria-live="polite"></span>
    <button id="memo-add" type="button" aria-label="選択中の7数字を予想メモに追加">メモに追加</button>
    <button id="clear-btn" type="button" aria-label="選択をすべて解除" disabled>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"></path><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg>
    </button>
  </div>
  <!-- C. 出目表・数字タップ欄(1つのスクロール領域。縦横とも #work がスクロールし、全行が同じ横位置を共有する) -->
  <main id="work" aria-label="出目表と数字選択">
    <div id="work-inner">
      <div id="head-row" class="row head"></div>
      <div id="table-rows"></div>
      <div id="pred-wrap"><div id="pred-row" class="row pred"></div></div>
    </div>
  </main>
  <!-- 予想メモ(下からせり上がるボトムシート。出目表のスクロール位置・縮尺・選択は保たれる) -->
  <section id="memo-screen" aria-label="予想メモ" hidden>
    <div id="memo-top">
      <span id="memo-grip" aria-hidden="true"></span>
      <div id="memo-top-row">
        <span class="cp-title">予想メモ</span>
        <button id="memo-close" type="button" aria-label="予想メモを閉じる">×</button>
      </div>
    </div>
    <div id="memo-head">
      <label id="memo-round-label">対象回<select id="memo-round" aria-label="表示する抽選回"></select></label>
      <span id="memo-target"></span>
      <div id="memo-filter" role="group" aria-label="絞り込み">
        <button type="button" data-filter="all" aria-pressed="true">すべて<span class="mf-n"></span></button>
        <button type="button" data-filter="buy" aria-pressed="false">★ 買う<span class="mf-n"></span></button>
        <button type="button" data-filter="maybe" aria-pressed="false">？ 迷い中<span class="mf-n"></span></button>
      </div>
    </div>
    <div id="memo-warn" hidden>この端末では予想メモを保存できません。画面を閉じると消えます(プライベートブラウズ中の場合は解除してください)。</div>
    <div id="memo-list" role="list"></div>
  </section>
  <!-- 確認ダイアログ・短いお知らせ -->
  <div id="confirm" role="alertdialog" aria-modal="true" aria-labelledby="cf-title" hidden>
    <div class="cf-box">
      <div class="cf-title" id="cf-title"></div>
      <div class="cf-text" id="cf-text"></div>
      <div class="cf-btns">
        <button id="cf-cancel" type="button">キャンセル</button>
        <button id="cf-ok" type="button"></button>
      </div>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
</div>
<script src="app.js"></script>
</body>
</html>
